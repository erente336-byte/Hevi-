<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For You</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #ffe6e6;
            text-align: center;
            color: #333;
        }

        .container {
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
            max-width: 400px;
            width: 90%;
        }

        h1 {
            font-size: 24px;
            margin-bottom: 30px;
            color: #ff4d4d;
        }

        .btn {
            background-color: #ff4d4d;
            color: white;
            border: none;
            padding: 12px 30px;
            margin: 10px;
            font-size: 18px;
            border-radius: 25px;
            cursor: pointer;
            transition: transform 0.2s, background-color 0.2s;
            outline: none;
        }

        .btn:hover {
            background-color: #ff1a1a;
            transform: scale(1.05);
        }

        .btn-secondary {
            background-color: #cccccc;
            color: #333;
        }

        .btn-secondary:hover {
            background-color: #b3b3b3;
        }

        /* Verstecke die Container am Anfang */
        #page2, #page3 {
            display: none;
        }

        /* Herz-Animation */
        .heart-wrapper {
            position: relative;
            display: inline-block;
            animation: heartbeat 1.2s infinite;
        }

        .heart-svg {
            width: 150px;
            height: 150px;
            fill: #ff4d4d;
        }

        .heart-text {
            position: absolute;
            top: 45%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 28px;
            font-weight: bold;
            font-family: 'Courier New', Courier, monospace;
        }

        @keyframes heartbeat {
            0% { transform: scale(1); }
            14% { transform: scale(1.1); }
            28% { transform: scale(1); }
            42% { transform: scale(1.1); }
            70% { transform: scale(1); }
        }
    </style>
</head>
<body>

    <div class="container" id="page1">
        <h1>Should we try again?</h1>
        <button class="btn" onclick="showHeart()">Yes</button>
        <button class="btn btn-secondary" onclick="showPage2()">No</button>
    </div>

    <div class="container" id="page2">
        <h1>Are you sure? Try again 😉</h1>
        <button class="btn" onclick="showHeart()">Yes</button>
        <button class="btn" onclick="showHeart()">Yes</button>
    </div>

    <div class="container" id="page3" style="background: transparent; box-shadow: none;">
        <div class="heart-wrapper">
            <svg class="heart-svg" viewBox="0 0 32 29.6">
                <path d="M23.6,0c-3.4,0-6.3,2.7-7.6,5.6C14.7,2.7,11.8,0,8.4,0C3.8,0,0,3.8,0,8.4c0,9.4,9.5,11.9,16,21.2
                c6.1-9.3,16-12.1,16-21.2C32,3.8,28.2,0,23.6,0z"/>
            </svg>
            <div class="heart-text">Hevi</div>
        </div>
    </div>

    <script>
        function showPage2() {
            document.getElementById('page1').style.display = 'none';
            document.getElementById('page2').style.display = 'block';
        }

        function showHeart() {
            document.getElementById('page1').style.display = 'none';
            document.getElementById('page2').style.display = 'none';
            document.getElementById('page3').style.display = 'block';
        }
    </script>

</body>
</html>
